name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Core and client contract tests use only Node built-ins. Host peer packages
      # are supplied by Harness and are not installed from the registry in CI.
      - run: node scripts/check.mjs
      - run: node --test test/*.test.mjs
      - run: npm pack --ignore-scripts --dry-run
